name: Publish

# Triggered by the tag push directly (not the release event): releases here
# are created by release.yml with GITHUB_TOKEN, and such events do not start
# other workflows.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.0)
        required: true

permissions: {}

jobs:
  crates-io:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # `cargo publish` packages `frontend/dist` (ADR 0012) and verifies the
      # package by building it. An unbuilt UI would publish a crate that
      # installs into a server with no web UI.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the web UI
        run: pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend build
      - name: Get a crates.io token (OIDC trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
