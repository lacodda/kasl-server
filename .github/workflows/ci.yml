name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The release build embeds `frontend/dist` (ADR 0012). Without this the
      # binary would be built around the repository's placeholder and the job
      # would pass while shipping no web UI at all.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the web UI
        run: pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend build
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  # The database-backed tests skip themselves without a database, so a green
  # matrix above proves nothing about the migrations or the ingest endpoint.
  # This job is where they actually run: a real PostgreSQL, migrated from empty
  # on every push.
  database:
    name: database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kasl
          POSTGRES_PASSWORD: kasl
          POSTGRES_DB: kasl
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kasl -d kasl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kasl:kasl@localhost:5432/kasl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the web UI
        run: pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend build
      # A skipped test also reports "ok", so the run is inspected rather than
      # trusted: if the database never reached the tests, this job must fail
      # instead of quietly passing on nothing.
      # The whole suite, not a list of test files: a named list silently stops
      # covering the test file added after it was written, and a job that runs
      # fewer tests than it looks like it does is worse than no job.
      - name: Test against PostgreSQL
        run: |
          set -o pipefail
          cargo test -- --nocapture 2>&1 | tee output.txt
          if grep -q 'skipped: DATABASE_URL is not set' output.txt; then
            echo "::error::the database tests skipped themselves; DATABASE_URL did not reach them"
            exit 1
          fi

  # The web UI has its own gate: types, lint and its unit tests. Kept separate
  # from the Rust matrix so a broken component is reported as a broken
  # component rather than as a failed release build.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Lint, typecheck and test
        run: pnpm --dir frontend lint
      - name: Build
        run: pnpm --dir frontend build

  # rust-version is a promise to anyone running `cargo install`. Without a job
  # that actually builds on it, the number silently rots the first time a new
  # API is used — so read it from the manifest and hold it to it.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from the manifest
        id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the web UI
        run: pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend build
      - name: Build on the declared MSRV
        run: cargo check --all-targets
