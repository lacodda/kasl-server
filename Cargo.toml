[package]
name = "kasl-server"
version = "0.24.0"
edition = "2024"
rust-version = "1.94"
description = "Team server for kasl: collects work-time data from employees' kasl agents and turns it into dashboards, reports, and personal pages"
license = "MIT"
repository = "https://github.com/lacodda/kasl-server"
homepage = "https://github.com/lacodda/kasl-server"
readme = "README.md"
keywords = ["time-tracking", "server", "team", "dashboard", "kasl"]
categories = ["web-programming::http-server"]
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
# The web UI ships as its build output, not as its sources: `cargo install
# kasl-server` must produce a working server without Node, and rust-embed reads
# `frontend/dist` at compile time (ADR 0012). `include` is what puts `dist` in
# the package at all - it is gitignored, and without an explicit list cargo
# would leave it out.
include = [
    "src/**",
    "migrations/**",
    "tests/**",
    "assets/**",
    "tools/**",
    "frontend/dist/**",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "Dockerfile",
    "docker-compose.yml",
    "docker-compose.prod.yml",
]

[dependencies]
anyhow = "1.0.104"
# Passwords, unlike the agents' random tokens, are human-chosen and worth
# guessing at scale - so they get a memory-hard hash rather than SHA-256.
# Default features carry what this uses: `getrandom` for the salt and
# `password-hash` for the PHC string stored in the database. 0.5 needed `std`
# spelled out; 0.6 dropped that feature and implies it.
argon2 = "0.6.0"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
# Session tokens come from the OS entropy source, not from a counter.
rand = "0.10.2"
# Webhook deliveries. Without its default TLS, which brings aws-lc-rs and a C
# toolchain to every build: the client is handed a rustls configuration on
# `ring` and the Mozilla roots - the stack sqlx already links for the database.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# Reads an agent's own database during import. Bundled rather than linked
# against a system SQLite: the file is the employee's history, and the version
# that reads it should not depend on what the host happens to ship.
rusqlite = { version = "0.39.0", features = ["bundled", "chrono"] }
# Hours and shares of a day are exact decimals, not floats: a norm that
# arrives at 7.999999 hours turns into an argument about a cent at the end
# of the month (ADR 0017).
rust_decimal = { version = "1.39.0", features = ["serde-float"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# Default features drag in the "any" driver, which pulls sqlx-sqlite and
# sqlx-mysql (and their native libsqlite3-sys) even though this server only
# ever talks to Postgres - and that sqlite pull collides with rusqlite's own
# libsqlite3-sys over the "sqlite3" native link. Only the pieces actually
# used are named: postgres, migrations, FromRow derives (macros) and the
# jsonb columns (json).
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
    "macros",
    "json",
    "chrono",
    "uuid",
    "rust_decimal",
] }
tokio = { version = "1.53.1", features = ["full"] }
# The built web UI is compiled into the binary, so a self-hosted install is one
# file and the UI can never be from a different build than the API (ADR 0012).
rust-embed = { version = "8.7.2", features = ["mime-guess"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }
webpki-roots = "1.0.9"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
# Integration tests are their own crates: the binary's dependencies do not
# reach them, so the schema tests declare what they touch directly.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
uuid = { version = "1.24.1", features = ["v4"] }
# The import tests build a fixture in the agent's own schema.
rusqlite = { version = "0.39.0", features = ["bundled"] }

# Line-table debug info keeps backtraces readable while cutting the .pdb weight
# that dominates target/debug. Full debug info is a one-line revert when needed.
[profile.dev]
debug = 1
